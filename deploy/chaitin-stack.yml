# Complete Portainer-managed Stack for the existing "chaitin" environment.
#
# Before updating this Stack, the server must already contain:
#   /data/chaitin/deploy-manifests/security-triage-agent/.env          (0600)
#   /data/chaitin/deploy-manifests/malware-triage-agent/.env           (0600)
#   /data/chaitin/secrets/release-runner-token                         (0600)
#   /data/chaitin/secrets/release-ui-confirmation                      (0600)
# No raw samples, private IOC, OctoBus token, model key, or private key is
# written in this file. Keep RELEASE_MODE=preview for the first deployment.
name: chaitin

networks:
  chaitin-net:
    name: chaitin-net

services:
  agent-compose:
    image: chaitin/agent-compose:latest
    container_name: agent-compose
    restart: always
    environment:
      HTTP_LISTEN: 0.0.0.0:7410
      DATA_ROOT: /data
      RUNTIME_DRIVER: docker
      DEFAULT_IMAGE: chaitin/agent-compose-guest:latest
      AGENT_COMPOSE_RUNTIME_BASE_URL: http://agent-compose:7410
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /data/chaitin/agent-compose/data:/data
      - /data/chaitin/deploy-manifests:/deploy:ro
      - /data/chaitin/private-knowledge-base:/data/chaitin/private-knowledge-base:ro
    working_dir: /data/work
    ports:
      - 127.0.0.1:7410:7410
    networks:
      - chaitin-net

  octobus:
    image: ghcr.io/chaitin/octobus:latest
    container_name: octobus
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /data/chaitin/octobus/data:/var/lib/octobus
    networks:
      - chaitin-net

  demo-console:
    image: ghcr.io/ch7pairsq/chaitin-demo-console:latest
    container_name: malware-triage-demo-console
    restart: always
    pull_policy: always
    environment:
      DEMO_MODE: replay
      DEMO_CONSOLE_PORT: 7411
      # Optional navigation link only; never put a Portainer credential here.
      PORTAINER_URL: ${PORTAINER_URL:-}
      # Keep preview until the Stack and release-runner health checks pass.
      RELEASE_MODE: ${RELEASE_MODE:-preview}
      RELEASE_RUNNER_URL: http://release-runner:7420
      RELEASE_RUNNER_TOKEN_FILE: /run/secrets/release_runner_token
      RELEASE_UI_CONFIRMATION_FILE: /run/secrets/release_ui_confirmation
    ports:
      - 127.0.0.1:7411:7411
    volumes:
      - /data/chaitin/secrets/release-runner-token:/run/secrets/release_runner_token:ro
      - /data/chaitin/secrets/release-ui-confirmation:/run/secrets/release_ui_confirmation:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - chaitin-net

  # Internal-only release executor. It is the sole service with Docker socket
  # access, accepts only fixed project names and already-pushed commit hashes,
  # and has no host port.
  release-runner:
    image: ghcr.io/ch7pairsq/chaitin-demo-console:release-runner
    container_name: chaitin-release-runner
    restart: always
    pull_policy: always
    environment:
      RELEASE_RUNNER_PORT: 7420
      RELEASE_RUNNER_TOKEN_FILE: /run/secrets/release_runner_token
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/chaitin/deploy-manifests:/deploy:rw
      - /data/chaitin/secrets/release-runner-token:/run/secrets/release_runner_token:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - chaitin-net
