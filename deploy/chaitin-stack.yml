# Complete Portainer-managed Stack for the existing "chaitin" environment.
#
# Before updating this Stack, the server must already contain:
#   /data/chaitin/deploy-manifests/security-triage-agent/.env          (0600)
#   /data/chaitin/deploy-manifests/malware-triage-agent/.env           (0600)
#   /data/chaitin/secrets/release-runner-token                         (0600)
#   /data/chaitin/secrets/release-ui-confirmation                      (0600)
#   /data/chaitin/secrets/agent-compose-ui-script-token                (0600)
#   /data/chaitin/secrets/agent-trigger-bridge-token                   (0600)
# No raw samples, private IOC, OctoBus token, model key, or private key is
# written in this file. Keep RELEASE_MODE=preview for the first deployment.
name: chaitin

networks:
  chaitin-net:
    name: chaitin-net

services:
  agent-compose:
    image: chaitin/agent-compose:latest
    container_name: agent-compose
    restart: always
    environment:
      HTTP_LISTEN: 0.0.0.0:7410
      DATA_ROOT: /data
      RUNTIME_DRIVER: docker
      DEFAULT_IMAGE: chaitin/agent-compose-guest:latest
      AGENT_COMPOSE_RUNTIME_BASE_URL: http://agent-compose:7410
      TZ: Asia/Shanghai
    # The daemon's Codex provider needs its own persistent model configuration.
    # Do not put the model key in this Stack.  The entrypoint below reads only
    # the three LLM fields from the existing root-only project .env file, which
    # is already mounted read-only for controlled project deployment.
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        source_env=/deploy/malware-triage-agent/.env
        read_env_value() {
          sed -n "s/^$$1=//p" "$$source_env" | tail -n 1 | tr -d '\r'
        }
        LLM_API_ENDPOINT="$$(read_env_value LLM_BASE_URL)"
        LLM_API_KEY="$$(read_env_value MALWARE_TRIAGE_LLM_API_KEY)"
        LLM_MODEL="$$(read_env_value LLM_MODEL)"
        if [ -z "$$LLM_API_ENDPOINT" ] || [ -z "$$LLM_API_KEY" ] || [ -z "$$LLM_MODEL" ]; then
          echo 'agent-compose LLM bootstrap: required root-only model configuration is missing' >&2
          exit 78
        fi
        export LLM_API_ENDPOINT LLM_API_KEY LLM_MODEL
        # DeepSeek is OpenAI-compatible through Chat Completions, not Responses.
        export LLM_API_PROTOCOL=chat_completions
        exec /usr/bin/tini -- /app/agent-compose daemon
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /data/chaitin/agent-compose/data:/data
      - /data/chaitin/deploy-manifests:/deploy:ro
      - /data/chaitin/private-knowledge-base:/data/chaitin/private-knowledge-base:ro
    working_dir: /data/work
    ports:
      - 127.0.0.1:7410:7410
    networks:
      - chaitin-net

  octobus:
    image: ghcr.io/chaitin/octobus:latest
    container_name: octobus
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /data/chaitin/octobus/data:/var/lib/octobus
    networks:
      - chaitin-net

  # Browser UI for Agent Compose. It authenticates browser users and proxies
  # requests to the daemon through the internal Stack network; it never mounts
  # the Docker socket or private knowledge base.
  agent-compose-ui:
    image: ghcr.io/chaitin/agent-compose-ui:latest
    container_name: agent-compose-ui
    restart: always
    # The image is pre-pulled by the administrator. Do not block a Stack
    # update on registry access; fail clearly if the local image is absent.
    pull_policy: never
    depends_on:
      - agent-compose
    environment:
      AGENT_COMPOSE_BACKEND: http://agent-compose:7410
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      # Configure these two values only in Portainer Stack environment
      # variables. They are UI login values, never Git repository content.
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in Portainer}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in Portainer}
      UI_DATABASE_PATH: /data/agent-compose-ui.db
      JUPYTER_PROXY_BASE: /jupyter
      NGINX_JUPYTER_PROXY_BASE: /jupyter
    # The upstream UI requires a separate token for its local script service.
    # Read it only from the root-owned server file rather than Portainer env.
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        token_file=/run/secrets/agent-compose-ui-script-token
        test -r "$$token_file"
        SCRIPT_SERVICE_TOKEN="$$(tr -d '\r\n' < "$$token_file")"
        test -n "$$SCRIPT_SERVICE_TOKEN"
        export SCRIPT_SERVICE_TOKEN
        exec /init
    volumes:
      - /data/chaitin/agent-compose/ui:/data
      - /data/chaitin/agent-compose/data/sandboxes:/data/sandboxes:ro
      - /data/chaitin/secrets/agent-compose-ui-script-token:/run/secrets/agent-compose-ui-script-token:ro
    ports:
      # Upstream UI Nginx listens on container port 80, never on 8000.
      - 127.0.0.1:${AGENT_COMPOSE_UI_HTTP_PORT:-7412}:80
    # The upstream image probes an unavailable gRPC-style path and remains in
    # "starting" even while Nginx is serving traffic. Probe its real HTTP root.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Needed only while Nginx initializes its cache directory and drops to
    # the unprivileged worker user; validated with the upstream image.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks:
      - chaitin-net

  demo-console:
    image: ghcr.io/ch7pairsq/chaitin-demo-console:latest
    container_name: malware-triage-demo-console
    restart: always
    pull_policy: never
    environment:
      # Hybrid keeps evidence replay for all cases and enables live runs only
      # for the two server-approved normal security cases below.
      DEMO_MODE: hybrid
      DEMO_CONSOLE_PORT: 7411
      # Optional navigation link only; never put a Portainer credential here.
      PORTAINER_URL: ${PORTAINER_URL:-https://8.147.68.154:9443}
      # Keep preview until the Stack and release-runner health checks pass.
      RELEASE_MODE: ${RELEASE_MODE:-preview}
      RELEASE_RUNNER_URL: http://release-runner:7420
      RELEASE_RUNNER_TOKEN_FILE: /run/secrets/release_runner_token
      RELEASE_UI_CONFIRMATION_FILE: /run/secrets/release_ui_confirmation
      AGENT_TRIGGER_BRIDGE_URL: http://agent-trigger-bridge:7430
      AGENT_TRIGGER_BRIDGE_TOKEN_FILE: /run/secrets/agent_trigger_bridge_token
    ports:
      - 127.0.0.1:7411:7411
    volumes:
      - /data/chaitin/secrets/release-runner-token:/run/secrets/release_runner_token:ro
      - /data/chaitin/secrets/release-ui-confirmation:/run/secrets/release_ui_confirmation:ro
      - /data/chaitin/secrets/agent-trigger-bridge-token:/run/secrets/agent_trigger_bridge_token:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - chaitin-net

  # Internal-only command gate for the controlled browser demonstration.
  # It is intentionally separate from release-runner: its token, allow-list,
  # and Docker operation are dedicated to Agent Compose runs, never releases.
  agent-trigger-bridge:
    image: ghcr.io/ch7pairsq/chaitin-demo-console:trigger-bridge
    container_name: agent-trigger-bridge
    restart: always
    pull_policy: never
    environment:
      AGENT_TRIGGER_BRIDGE_PORT: 7430
      AGENT_TRIGGER_BRIDGE_TOKEN_FILE: /run/secrets/agent_trigger_bridge_token
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/chaitin/secrets/agent-trigger-bridge-token:/run/secrets/agent_trigger_bridge_token:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - chaitin-net

  # Internal-only release executor. It is the sole service with Docker socket
  # access, accepts only fixed project names and already-pushed commit hashes,
  # and has no host port.
  release-runner:
    image: ghcr.io/ch7pairsq/chaitin-demo-console:release-runner
    container_name: chaitin-release-runner
    restart: always
    pull_policy: never
    environment:
      RELEASE_RUNNER_PORT: 7420
      RELEASE_RUNNER_TOKEN_FILE: /run/secrets/release_runner_token
      HOME: /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/chaitin/deploy-manifests:/deploy:rw
      - /data/chaitin/secrets/release-runner-token:/run/secrets/release_runner_token:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - chaitin-net
